syntax = "proto3";

package edgesched;

// Required for Go codegen (protoc-gen-go)
option go_package = "edgesched/scheduler/generated";

// One inference engine (e.g. yolo26n_int8, yolo26m_fp16) exposes this
// service over its own gRPC port. The Go scheduler talks to each engine
// process independently.
service Inference {
  rpc Predict(PredictRequest) returns (PredictResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message PredictRequest {
  bytes image_data = 1; // raw image bytes (e.g. JPEG/PNG), decoded server side
}

message Detection {
  float x1 = 1; // bounding box, original image pixel coordinates
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
  float confidence = 5;
  int32 class_id = 6;
  string class_name = 7;
}

message PredictResponse {
  repeated Detection detections = 1;
  float preprocess_ms = 2;
  float inference_ms = 3;
  float postprocess_ms = 4;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool serving = 1;
  string engine_name = 2;
}
