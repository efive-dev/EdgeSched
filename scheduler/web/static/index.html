<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeSched Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --fg: #000000;
    --muted-bg: #F5F5F5;
    --muted-fg: #525252;
    --border: #000000;
    --border-light: #E5E5E5;

    --font-display: "Playfair Display", Georgia, serif;
    --font-body: "Source Serif 4", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body { background: var(--bg); }

  body {
    margin: 0;
    color: var(--fg);
    font-family: var(--font-body);
    position: relative;
  }

  /* Layered monochrome texture — global hairline pattern, kept extremely subtle */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 1px, #000 1px, #000 2px
    );
    background-size: 100% 4px;
    opacity: 0.015;
  }

  header, main { position: relative; z-index: 1; }

  header {
    padding: 40px 48px 32px;
    border-bottom: 4px solid var(--border);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.25rem, 4.5vw, 3.5rem);
    letter-spacing: -0.025em;
    line-height: 1;
    margin: 0 0 14px 0;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-fg);
  }

  .subtitle strong {
    color: var(--fg);
    font-weight: 600;
  }

  main {
    padding: 40px 48px 56px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 28px 32px;
  }

  .panel h2 {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted-fg);
    margin: 0 0 18px 0;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-light);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-light);
    font-size: 1rem;
  }
  .stat-row:last-child { border-bottom: none; }

  .stat-val {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .chart-wrap {
    position: relative;
    height: 170px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border-light);
  }

  .engine-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-light);
    font-size: 0.95rem;
  }
  .engine-row:last-child { border-bottom: none; }

  .engine-name {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .engine-name .swatch {
    width: 11px;
    height: 11px;
    flex-shrink: 0;
    display: inline-block;
  }

  select, input[type=number] {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 0.82rem;
    border: none;
    border-bottom: 2px solid var(--border);
    border-radius: 0;
    padding: 8px 4px;
    outline: none;
    transition: border-width 100ms;
  }
  select:focus, input[type=number]:focus {
    border-bottom-width: 4px;
  }
  input[type=number] { width: 220px; }
  input[type=number]::placeholder { color: var(--muted-fg); font-style: italic; }

  input[type=file] {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted-fg);
  }
  input[type=file]::file-selector-button {
    background: var(--fg);
    color: var(--bg);
    border: none;
    border-radius: 0;
    padding: 8px 16px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 14px;
    cursor: pointer;
    transition: background-color 100ms, color 100ms;
  }
  input[type=file]::file-selector-button:hover {
    background: var(--bg);
    color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--border);
  }

  button {
    background: var(--fg);
    color: var(--bg);
    border: 2px solid var(--fg);
    border-radius: 0;
    padding: 10px 28px;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background-color 100ms, color 100ms;
  }
  button:hover {
    background: var(--bg);
    color: var(--fg);
  }
  button:focus-visible,
  select:focus-visible,
  input:focus-visible {
    outline: 3px solid var(--fg);
    outline-offset: 3px;
  }

  .predict-controls {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 22px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border-light);
  }

  #predictResult {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--muted-fg);
    white-space: pre-wrap;
    margin-top: 18px;
    line-height: 1.75;
  }

  #resultCanvas {
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 0;
    margin-top: 18px;
    display: none;
  }

  .full-width { grid-column: 1 / -1; }

  @media (max-width: 760px) {
    header { padding: 28px 24px 24px; }
    main { padding: 28px 24px 40px; }
    .grid { grid-template-columns: 1fr; }
    .panel { padding: 22px 20px; }
    input[type=number] { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>EdgeSched</h1>
  <div class="subtitle">
    Routing policy — <strong id="policyName">—</strong> · polling /status every 1s
  </div>
</header>

<main>
<div class="grid">

  <div class="panel">
    <h2>System State</h2>
    <div class="stat-row"><span>Max temperature</span><span class="stat-val" id="tempVal">—</span></div>
    <div class="stat-row"><span>Power draw</span><span class="stat-val" id="powerVal">—</span></div>
    <div class="stat-row"><span>GPU utilization</span><span class="stat-val" id="gpuVal">—</span></div>
    <div class="stat-row"><span>RAM used</span><span class="stat-val" id="ramVal">—</span></div>
    <div class="stat-row"><span>Power mode</span><span class="stat-val" id="powerModeVal">—</span></div>
    <div class="chart-wrap"><canvas id="tempChart"></canvas></div>
  </div>

  <div class="panel">
    <h2>Engine Queue Depth</h2>
    <div id="engineList"></div>
    <div class="chart-wrap"><canvas id="queueChart"></canvas></div>
  </div>

  <div class="panel full-width">
    <h2>Send an Image</h2>
    <div class="predict-controls">
      <input type="file" id="imageInput" accept="image/*">
      <select id="engineSelect"><option value="">(auto)</option></select>
      <input type="number" id="budgetInput" placeholder="latency budget ms (optional)">
      <button onclick="sendPredict()">Predict</button>
    </div>
    <canvas id="resultCanvas"></canvas>
    <div id="predictResult"></div>
  </div>

</div>
</main>

<script>
const HISTORY_LEN = 60; // seconds of history retained (1 point/sec)

const SERIES_COLORS = [
  '#8B1A1A', // ink crimson
  '#1B4B43', // deep teal
  '#9C6B0B', // dark ochre
  '#3B3562', // indigo
  '#5C5F2D', // olive
  '#7A3B69', // plum
];

function colorSwatchHtml(color) {
  return '<span class="swatch" style="background:' + color + '"></span>';
}

function nowLabel() {
  const d = new Date();
  return d.getHours().toString().padStart(2, '0') + ':' +
         d.getMinutes().toString().padStart(2, '0') + ':' +
         d.getSeconds().toString().padStart(2, '0');
}

function baseChartOptions(yLabel) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    scales: {
      x: {
        ticks: { color: '#525252', maxTicksLimit: 6, font: { family: "'JetBrains Mono', monospace", size: 10 } },
        grid: { color: '#E5E5E5' }
      },
      y: {
        ticks: { color: '#525252', font: { family: "'JetBrains Mono', monospace", size: 10 } },
        grid: { color: '#E5E5E5' },
        title: { display: !!yLabel, text: yLabel, color: '#525252', font: { family: "'JetBrains Mono', monospace", size: 10 } }
      }
    },
    plugins: {
      legend: { labels: { color: '#000', boxWidth: 16, font: { family: "'JetBrains Mono', monospace", size: 10 } } }
    }
  };
}

const tempChart = new Chart(document.getElementById('tempChart'), {
  type: 'line',
  data: { labels: [], datasets: [{
    label: 'Max temp (°C)', data: [], borderColor: '#000000',
    backgroundColor: '#00000010', fill: true, tension: 0.15, pointRadius: 0, borderWidth: 2
  }]},
  options: baseChartOptions('°C')
});

const queueChart = new Chart(document.getElementById('queueChart'), {
  type: 'line',
  data: { labels: [], datasets: [] },
  options: baseChartOptions('requests waiting')
});

const engineDatasetIndex = {}; // engine name -> index into queueChart.data.datasets
const engineColor = {};        // engine name -> assigned color

function pushPoint(chart, label) {
  chart.data.labels.push(label);
  if (chart.data.labels.length > HISTORY_LEN) chart.data.labels.shift();
  chart.data.datasets.forEach(ds => {
    if (ds.data.length > HISTORY_LEN) ds.data.shift();
  });
}

async function pollStatus() {
  try {
    const resp = await fetch('/status');
    if (!resp.ok) return;
    const data = await resp.json();
    const label = nowLabel();

    document.getElementById('policyName').textContent = data.policy;

    const sys = data.system;
    document.getElementById('tempVal').textContent = sys.valid ? sys.max_temp_c.toFixed(1) + ' °C' : '—';
    document.getElementById('powerVal').textContent = sys.valid ? (sys.power_mw / 1000).toFixed(2) + ' W' : '—';
    document.getElementById('gpuVal').textContent = sys.valid ? sys.gpu_util_pct.toFixed(0) + ' %' : '—';
    document.getElementById('ramVal').textContent = sys.valid ? sys.ram_used_mb + ' / ' + sys.ram_total_mb + ' MB' : '—';
    document.getElementById('powerModeVal').textContent = sys.valid ? sys.power_mode : '—';

    if (sys.valid) {
      pushPoint(tempChart, label);
      tempChart.data.datasets[0].data.push(sys.max_temp_c);
      tempChart.update('none');
    }

    data.engines.forEach((e) => {
      if (!(e.name in engineDatasetIndex)) {
        const color = SERIES_COLORS[Object.keys(engineDatasetIndex).length % SERIES_COLORS.length];
        engineColor[e.name] = color;
        queueChart.data.datasets.push({
          label: e.name, data: [],
          borderColor: color,
          backgroundColor: color + '1A',
          borderWidth: 2,
          fill: false, tension: 0.15, pointRadius: 0
        });
        engineDatasetIndex[e.name] = queueChart.data.datasets.length - 1;
      }
    });

    pushPoint(queueChart, label);
    data.engines.forEach(e => {
      queueChart.data.datasets[engineDatasetIndex[e.name]].data.push(e.queue_depth);
    });
    queueChart.update('none');

    const engineList = document.getElementById('engineList');
    engineList.innerHTML = data.engines.map((e) =>
      '<div class="engine-row"><span class="engine-name">' +
      colorSwatchHtml(engineColor[e.name]) + e.name + '</span>' +
      '<span class="stat-val">' + e.queue_depth + '</span></div>'
    ).join('');

    const select = document.getElementById('engineSelect');
    const currentNames = Array.from(select.options).map(o => o.value).filter(v => v).join(',');
    const newNames = data.engines.map(e => e.name);
    if (currentNames !== newNames.join(',')) {
      select.innerHTML = '<option value="">(auto)</option>' +
        newNames.map(n => '<option value="' + n + '">' + n + '</option>').join('');
    }
  } catch (e) {
    console.error('status poll failed', e);
  }
}

setInterval(pollStatus, 1000);
pollStatus();

// Predict form

function colorForClass(classId) {
  return SERIES_COLORS[classId % SERIES_COLORS.length];
}

async function sendPredict() {
  const fileInput = document.getElementById('imageInput');
  if (!fileInput.files.length) { alert('Choose an image first.'); return; }
  const file = fileInput.files[0];

  const engine = document.getElementById('engineSelect').value;
  const budget = document.getElementById('budgetInput').value;
  const params = [];
  if (engine) params.push('engine=' + encodeURIComponent(engine));
  if (budget) params.push('latency_budget_ms=' + encodeURIComponent(budget));
  const url = '/predict' + (params.length ? '?' + params.join('&') : '');

  const resultEl = document.getElementById('predictResult');
  resultEl.textContent = 'sending…';

  try {
    const buf = await file.arrayBuffer();
    const t0 = performance.now();
    const resp = await fetch(url, { method: 'POST', body: buf });
    const elapsedMs = performance.now() - t0;

    if (!resp.ok) {
      const text = await resp.text();
      resultEl.textContent = 'Error ' + resp.status + ': ' + text;
      return;
    }

    const data = await resp.json();
    renderResult(file, data, elapsedMs);
  } catch (e) {
    resultEl.textContent = 'Request failed: ' + e;
  }
}

function renderResult(file, data, elapsedMs) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.getElementById('resultCanvas');
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const baseWidth = Math.max(2, img.width / 400);
    ctx.font = Math.max(14, img.width / 80) + 'px "Source Serif 4", Georgia, serif';
    ctx.textBaseline = 'bottom';

    for (const d of (data.detections || [])) {
      const color = colorForClass(d.class_id);
      ctx.strokeStyle = color;
      ctx.lineWidth = baseWidth;
      ctx.strokeRect(d.x1, d.y1, d.x2 - d.x1, d.y2 - d.y1);

      const label = (d.class_name || ('cls_' + d.class_id)) + ' ' + d.confidence.toFixed(2);
      const textWidth = ctx.measureText(label).width;
      const labelY = Math.max(20, d.y1);
      ctx.fillStyle = color;
      ctx.fillRect(d.x1, labelY - 20, textWidth + 10, 20);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, d.x1 + 5, labelY - 3);
    }
  };
  img.src = URL.createObjectURL(file);

  const lines = [
    'engine=' + data.engine + '  auto_routed=' + data.auto_routed,
    'preprocess=' + data.preprocess_ms.toFixed(1) + 'ms  ' +
      'inference=' + data.inference_ms.toFixed(1) + 'ms  ' +
      'postprocess=' + data.postprocess_ms.toFixed(2) + 'ms',
    'round_trip=' + elapsedMs.toFixed(0) + 'ms (client-observed, includes network)',
    'queue_depth_at_submit=' + data.queue_depth_at_submit + '  ' +
      'latency_budget_ms=' + data.latency_budget_ms,
    'detections=' + (data.detections || []).length
  ];
  document.getElementById('predictResult').textContent = lines.join('\n');
}
</script>
</body>
</html>
