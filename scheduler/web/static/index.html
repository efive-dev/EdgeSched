<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EDGESCHED // LIVE</title>
<script src="vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #09090B;
    --fg: #FAFAFA;
    --muted: #27272A;
    --muted-fg: #A1A1AA;
    --accent: #DFE104;
    --accent-fg: #000000;
    --border: #3F3F46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
                 Roboto, Arial, sans-serif;
  }
  ::selection { background: var(--accent); color: var(--accent-fg); }

  .page { padding: 40px 32px 64px; max-width: 1400px; margin: 0 auto; }

  h1.hero {
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    font-weight: 700;
    margin: 0 0 4px 0;
  }
  h1.hero .accent-word { color: var(--accent); }
  .subtitle {
    color: var(--muted-fg);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 40px;
  }
  .subtitle strong { color: var(--fg); }

  h2.section-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted-fg);
    font-weight: 700;
    margin: 0 0 18px 0;
    border-bottom: 2px solid var(--border);
    padding-bottom: 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: var(--border);
    margin-bottom: 2px;
  }
  .panel {
    background: var(--bg);
    padding: 24px 28px;
  }
  .full-width { grid-column: 1 / -1; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 8px;
  }
  .stat-block { border-left: 4px solid var(--accent); padding-left: 14px; }
  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted-fg);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .stat-number {
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .stat-number.hot { color: var(--accent); }
  .stat-sub { font-size: 12px; color: var(--muted-fg); margin-top: 2px; text-transform: uppercase; }

  .chart-wrap { position: relative; height: 180px; margin-top: 18px; }

  .engine-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    font-weight: 700;
    font-size: 14px;
  }
  .engine-row:last-child { border-bottom: none; }
  .engine-queue { font-size: 28px; font-variant-numeric: tabular-nums; }

  .live-feed-meta {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
    color: var(--muted-fg);
    text-transform: none;
    letter-spacing: 0;
    margin-top: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  #liveCanvas {
    max-width: 100%;
    border: 2px solid var(--border);
    display: block;
    background: var(--muted);
  }
  .live-feed-placeholder {
    color: var(--muted-fg);
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 60px 0;
    text-align: center;
    border: 2px dashed var(--border);
  }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-fg);
    text-transform: uppercase;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    margin-right: 8px;
  }

  .predict-controls {
    display: flex;
    gap: 0;
    align-items: stretch;
    flex-wrap: wrap;
    margin-bottom: 20px;
    border: 2px solid var(--border);
  }
  .predict-controls > * {
    background: var(--bg);
    color: var(--fg);
    border: none;
    border-right: 2px solid var(--border);
    padding: 14px 16px;
    font-family: inherit;
    font-size: 13px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .predict-controls > *:last-child { border-right: none; }
  input[type=file] { flex: 1; min-width: 220px; }
  select, input[type=number] { min-width: 140px; }
  button.predict-btn {
    background: var(--accent);
    color: var(--accent-fg);
    cursor: pointer;
    transition: transform 0.15s ease-in-out;
    letter-spacing: 0.05em;
  }
  button.predict-btn:hover { transform: scale(1.03); }
  button.predict-btn:active { transform: scale(0.96); }

  #resultCanvas {
    max-width: 100%;
    border: 2px solid var(--border);
    margin-top: 10px;
    display: none;
    background: var(--muted);
  }
  #predictResult {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
    color: var(--muted-fg);
    white-space: pre-wrap;
    margin-top: 12px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="page">

  <h1 class="hero">EDGE<span class="accent-word">SCHED</span></h1>
  <div class="subtitle">
    Routing policy: <strong id="policyName">—</strong> &nbsp;·&nbsp;
    live state polled every 1s &nbsp;·&nbsp;
    Jetson Orin Nano
  </div>

  <div class="grid">

    <div class="panel">
      <h2 class="section-label">System State</h2>
      <div class="stat-grid">
        <div class="stat-block">
          <div class="stat-label">Max Temp</div>
          <div class="stat-number" id="tempVal">—</div>
          <div class="stat-sub">°C</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Power Draw</div>
          <div class="stat-number" id="powerVal">—</div>
          <div class="stat-sub">Watts</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">GPU Util</div>
          <div class="stat-number" id="gpuVal">—</div>
          <div class="stat-sub">Percent</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Power Mode</div>
          <div class="stat-number" id="powerModeVal" style="font-size:1.6rem">—</div>
          <div class="stat-sub" id="ramVal">— MB RAM</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="tempChart"></canvas></div>
    </div>

    <div class="panel">
      <h2 class="section-label">Engine Queues</h2>
      <div id="engineList"></div>
      <div class="chart-wrap"><canvas id="queueChart"></canvas></div>
    </div>

    <div class="panel full-width">
      <h2 class="section-label">Live Feed &mdash; Most Recent Prediction (Any Source)</h2>
      <div id="liveFeedContent">
        <div class="live-feed-placeholder">Waiting for the first prediction…</div>
      </div>
    </div>

    <div class="panel full-width">
      <h2 class="section-label">Send An Image</h2>
      <div class="predict-controls">
        <input type="file" id="imageInput" accept="image/*">
        <select id="engineSelect"><option value="">(auto)</option></select>
        <input type="number" id="budgetInput" placeholder="Budget MS">
        <button class="predict-btn" onclick="sendPredict()">Predict &rarr;</button>
      </div>
      <canvas id="resultCanvas"></canvas>
      <div id="predictResult"></div>
    </div>

  </div>
</div>

<script>
const HISTORY_LEN = 60;
const ENGINE_COLORS = ['#DFE104', '#5cd68b', '#ff6b9d', '#55aaff', '#c792ea'];

function nowLabel() {
  const d = new Date();
  return d.getHours().toString().padStart(2, '0') + ':' +
         d.getMinutes().toString().padStart(2, '0') + ':' +
         d.getSeconds().toString().padStart(2, '0');
}

function baseChartOptions(yLabel) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    scales: {
      x: { ticks: { color: '#A1A1AA', maxTicksLimit: 6, font: { family: 'monospace', size: 10 } },
           grid: { color: '#3F3F46' } },
      y: { ticks: { color: '#A1A1AA' }, grid: { color: '#3F3F46' },
           title: { display: !!yLabel, text: yLabel, color: '#A1A1AA' } }
    },
    plugins: {
      legend: { labels: { color: '#FAFAFA', boxWidth: 12, font: { size: 11, weight: 'bold' } } }
    }
  };
}

const tempChart = new Chart(document.getElementById('tempChart'), {
  type: 'line',
  data: { labels: [], datasets: [{
    label: 'MAX TEMP (°C)', data: [], borderColor: '#DFE104',
    backgroundColor: '#DFE10422', fill: true, tension: 0.2, pointRadius: 0, borderWidth: 2
  }]},
  options: baseChartOptions('°C')
});

const queueChart = new Chart(document.getElementById('queueChart'), {
  type: 'line',
  data: { labels: [], datasets: [] },
  options: baseChartOptions('requests waiting')
});

const engineDatasetIndex = {};

function pushPoint(chart, label) {
  chart.data.labels.push(label);
  if (chart.data.labels.length > HISTORY_LEN) chart.data.labels.shift();
  chart.data.datasets.forEach(ds => { if (ds.data.length > HISTORY_LEN) ds.data.shift(); });
}

function colorForClass(classId) {
  const hue = (classId * 137.508) % 360;
  return 'hsl(' + hue + ', 80%, 60%)';
}

function drawDetections(ctx, img, detections) {
  ctx.drawImage(img, 0, 0);
  ctx.lineWidth = Math.max(2, img.width / 400);
  ctx.font = 'bold ' + Math.max(14, img.width / 80) + 'px sans-serif';
  ctx.textBaseline = 'bottom';

  for (const d of (detections || [])) {
    const color = colorForClass(d.class_id);
    ctx.strokeStyle = color;
    ctx.strokeRect(d.x1, d.y1, d.x2 - d.x1, d.y2 - d.y1);

    const label = ((d.class_name || ('CLS_' + d.class_id)) + ' ' + d.confidence.toFixed(2)).toUpperCase();
    const textWidth = ctx.measureText(label).width;
    const labelY = Math.max(20, d.y1);
    ctx.fillStyle = color;
    ctx.fillRect(d.x1, labelY - 22, textWidth + 10, 22);
    ctx.fillStyle = '#000';
    ctx.fillText(label, d.x1 + 5, labelY - 4);
  }
}

let lastSeenResultAt = 0;
let liveFeedInitialized = false;

async function fetchLastResult() {
  try {
    const resp = await fetch('/last-result');
    if (!resp.ok) return; // 404 = nothing predicted yet, fine

    const data = await resp.json();

    const content = document.getElementById('liveFeedContent');
    if (!liveFeedInitialized) {
      content.innerHTML =
        '<canvas id="liveCanvas"></canvas><div class="live-feed-meta" id="liveFeedMeta"></div>';
      liveFeedInitialized = true;
    }

    const img = new Image();
    img.onload = () => {
      const canvas = document.getElementById('liveCanvas');
      canvas.width = img.width;
      canvas.height = img.height;
      drawDetections(canvas.getContext('2d'), img, data.detections);
    };
    img.src = 'data:image/jpeg;base64,' + data.image_base64;

    const ageSec = ((Date.now() - data.timestamp_ms) / 1000).toFixed(0);
    document.getElementById('liveFeedMeta').innerHTML =
      '<span class="badge">' + data.engine.toUpperCase() + '</span>' +
      '<span class="badge" style="background:var(--muted-fg);color:#000">' +
      (data.auto_routed ? 'AUTO-ROUTED' : 'MANUAL') + '</span>\n\n' +
      'preprocess=' + data.preprocess_ms.toFixed(1) + 'ms  ' +
      'inference=' + data.inference_ms.toFixed(1) + 'ms  ' +
      'postprocess=' + data.postprocess_ms.toFixed(2) + 'ms\n' +
      'detections=' + (data.detections || []).length + '  ' +
      '(' + ageSec + 's ago)';
  } catch (e) {
    console.error('last-result fetch failed', e);
  }
}

async function pollStatus() {
  try {
    const resp = await fetch('/status');
    if (!resp.ok) return;
    const data = await resp.json();
    const label = nowLabel();

    document.getElementById('policyName').textContent = data.policy.toUpperCase();

    const sys = data.system;
    document.getElementById('tempVal').textContent = sys.valid ? sys.max_temp_c.toFixed(1) : '—';
    document.getElementById('tempVal').className = 'stat-number' + (sys.valid && sys.max_temp_c >= 55 ? ' hot' : '');
    document.getElementById('powerVal').textContent = sys.valid ? (sys.power_mw / 1000).toFixed(2) : '—';
    document.getElementById('gpuVal').textContent = sys.valid ? sys.gpu_util_pct.toFixed(0) : '—';
    document.getElementById('powerModeVal').textContent = sys.valid ? sys.power_mode : '—';
    document.getElementById('ramVal').textContent = sys.valid ? (sys.ram_used_mb + ' / ' + sys.ram_total_mb + ' MB RAM') : '—';

    if (sys.valid) {
      pushPoint(tempChart, label);
      tempChart.data.datasets[0].data.push(sys.max_temp_c);
      tempChart.update('none');
    }

    data.engines.forEach((e) => {
      if (!(e.name in engineDatasetIndex)) {
        const color = ENGINE_COLORS[Object.keys(engineDatasetIndex).length % ENGINE_COLORS.length];
        queueChart.data.datasets.push({
          label: e.name.toUpperCase(), data: [], borderColor: color,
          backgroundColor: color + '22', fill: false, tension: 0.2, pointRadius: 0, borderWidth: 2
        });
        engineDatasetIndex[e.name] = queueChart.data.datasets.length - 1;
      }
    });
    pushPoint(queueChart, label);
    data.engines.forEach(e => {
      queueChart.data.datasets[engineDatasetIndex[e.name]].data.push(e.queue_depth);
    });
    queueChart.update('none');

    const engineList = document.getElementById('engineList');
    engineList.innerHTML = data.engines.map((e, i) =>
      '<div class="engine-row"><span style="color:' + ENGINE_COLORS[i % ENGINE_COLORS.length] + '">&#9632; ' +
      e.name + '</span><span class="engine-queue">' + e.queue_depth + '</span></div>'
    ).join('');

    const select = document.getElementById('engineSelect');
    const currentNames = Array.from(select.options).map(o => o.value).filter(v => v).join(',');
    const newNames = data.engines.map(e => e.name);
    if (currentNames !== newNames.join(',')) {
      select.innerHTML = '<option value="">(auto)</option>' +
        newNames.map(n => '<option value="' + n + '">' + n.toUpperCase() + '</option>').join('');
    }

    if (data.last_result_at > 0 && data.last_result_at !== lastSeenResultAt) {
      lastSeenResultAt = data.last_result_at;
      fetchLastResult();
    }
  } catch (e) {
    console.error('status poll failed', e);
  }
}

setInterval(pollStatus, 1000);
pollStatus();


async function sendPredict() {
  const fileInput = document.getElementById('imageInput');
  if (!fileInput.files.length) { alert('Choose an image first.'); return; }
  const file = fileInput.files[0];

  const engine = document.getElementById('engineSelect').value;
  const budget = document.getElementById('budgetInput').value;
  const params = [];
  if (engine) params.push('engine=' + encodeURIComponent(engine));
  if (budget) params.push('latency_budget_ms=' + encodeURIComponent(budget));
  const url = '/predict' + (params.length ? '?' + params.join('&') : '');

  const resultEl = document.getElementById('predictResult');
  resultEl.textContent = 'SENDING…';

  try {
    const buf = await file.arrayBuffer();
    const t0 = performance.now();
    const resp = await fetch(url, { method: 'POST', body: buf });
    const elapsedMs = performance.now() - t0;

    if (!resp.ok) {
      const text = await resp.text();
      resultEl.textContent = 'ERROR ' + resp.status + ': ' + text;
      return;
    }

    const data = await resp.json();
    renderResult(file, data, elapsedMs);
  } catch (e) {
    resultEl.textContent = 'REQUEST FAILED: ' + e;
  }
}

function renderResult(file, data, elapsedMs) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.getElementById('resultCanvas');
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.style.display = 'block';
    drawDetections(canvas.getContext('2d'), img, data.detections);
  };
  img.src = URL.createObjectURL(file);

  const lines = [
    'ENGINE=' + data.engine.toUpperCase() + '  AUTO_ROUTED=' + data.auto_routed,
    'preprocess=' + data.preprocess_ms.toFixed(1) + 'ms  ' +
      'inference=' + data.inference_ms.toFixed(1) + 'ms  ' +
      'postprocess=' + data.postprocess_ms.toFixed(2) + 'ms',
    'round_trip=' + elapsedMs.toFixed(0) + 'ms (client-observed)',
    'queue_depth_at_submit=' + data.queue_depth_at_submit + '  latency_budget_ms=' + data.latency_budget_ms,
    'detections=' + (data.detections || []).length
  ];
  document.getElementById('predictResult').textContent = lines.join('\n');
}
</script>

</body>
</html>
